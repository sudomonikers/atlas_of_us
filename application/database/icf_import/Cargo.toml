[package]
name = "icf-import"
version = "0.1.0"
edition = "2024"

[dependencies]
# Reading WHO's tabulation, and the ICD-API's json
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# The ICD-API
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

