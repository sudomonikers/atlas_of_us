[package]
name = "atlas-api"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web Framework
axum = { version = "0.8.8", features = ["macros"] }
tower = { version = "0.5.2", features = ["full"] }
tower-http = { version = "0.6.8", features = ["trace", "timeout", "request-id"] }

# Async Runtime
tokio = { version = "1.53.2", features = ["full", "tracing"] }
chrono = { version = "0.4.41", features = ["serde"] }
futures = "0.3.34"

# Database (optional)
neo4rs = "0.9.0-rc.10"

# OpenTelemetry
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio", "logs"] }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic", "trace", "logs"] }
opentelemetry-appender-tracing = "0.33"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.34"

# Observability
axum-prometheus = "0.10.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# uuids
uuid = { version = "1.17.0", features = ["serde", "v4"] }

# Auth
jsonwebtoken = "9"
argon2 = { version = "0.5", features = ["std"] }

# LLM scoring
aws-config = { version = "1", default-features = false, features = ["legacy-client", "rt-tokio", "credentials-process", "sso"] }
aws-sdk-bedrockruntime = { version = "1", default-features = false, features = ["legacy-https-client", "rt-tokio"] }

# Lambda (function URL events use the API Gateway HTTP payload)
lambda_http = { version = "1.3.1", default-features = false, features = ["apigw_http", "tracing"] }
