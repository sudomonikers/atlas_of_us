[package]
name = "atlas-api"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web Framework
axum = { version = "0.8.8", features = ["macros"] }

# Async Runtime
tokio = { version = "1.53.2", features = ["full"] }
chrono = { version = "0.4.41", features = ["serde"] }

# Database (optional)
neo4rs = "0.9.0-rc.10"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.6", features = ["trace", "request-id"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Auth
jsonwebtoken = "9"
argon2 = { version = "0.5", features = ["std"] }

# AWS: the atlas-jobs queue, the atlas-events bus, and bedrock for the skills gates and embeddings
aws-config = { version = "1", default-features = false, features = ["legacy-client", "rt-tokio", "credentials-process", "sso"] }
aws-sdk-sqs = { version = "1.114.0", default-features = false, features = ["rt-tokio", "legacy-https-client"] }
aws-sdk-eventbridge = { version = "1.125.0", default-features = false, features = ["rt-tokio", "legacy-https-client"] }
aws-sdk-bedrockruntime = { version = "1.148.0", default-features = false, features = ["rt-tokio", "legacy-https-client"] }

# Email
aws-sdk-s3 = { version = "1.152.0", default-features = false, features = ["rt-tokio", "legacy-https-client"] }
aws-sdk-sesv2 = { version = "1.140.1", default-features = false, features = ["rt-tokio", "legacy-https-client"] }
mail-parser = "0.11.9"
mail-builder = "1.0.0"

# Lambda (function URL events use the API Gateway HTTP payload)
lambda_http = { version = "1.3.1", default-features = false, features = ["apigw_http"] }

# Shared with atlas-jobs: bedrock, the event bus and the skills resolver
atlas-shared = { path = "../atlas-shared" }

# Misc
futures = "0.3.34"
uuid = { version = "1.29.0", features = ["v4"] }
