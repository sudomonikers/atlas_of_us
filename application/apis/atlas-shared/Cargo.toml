[package]
name = "atlas-shared"
version = "0.1.0"
edition = "2024"

# code atlas-api and atlas-jobs both run: calls to bedrock, publishing to the event bus, and the skills resolver
[dependencies]
# Database
neo4rs = "0.9.0-rc.10"

# Tracing
tracing = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# AWS: bedrock for the resolver's judge and embeddings, and the atlas-events bus
aws-config = { version = "1", default-features = false, features = ["legacy-client", "rt-tokio", "credentials-process", "sso"] }
aws-sdk-bedrockruntime = { version = "1.148.0", default-features = false, features = ["rt-tokio", "legacy-https-client"] }
aws-sdk-eventbridge = { version = "1.125.0", default-features = false, features = ["rt-tokio", "legacy-https-client"] }

# Events: an id and a timestamp on each
uuid = { version = "1.29.0", features = ["v4"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
